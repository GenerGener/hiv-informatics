# MkDocs Material configuration for the HIV Informatics book.
# Navigation (Parts and chapters) lives in nav.yml, generated by tools/build_book.py.
INHERIT: nav.yml

site_name: HIV Informatics
site_description: >-
  HIV Informatics: a framework unifying HIV models, nucleic acid (re)sequencing,
  bioinformatics, and validation to maximize HIV information from samples.
site_author: Alejandro Rafael Gener
site_url: https://genergener.github.io/hiv-informatics/
repo_url: https://github.com/GenerGener/hiv-informatics
repo_name: GenerGener/hiv-informatics
edit_uri: edit/main/docs/

copyright: >-
  <span class="footer-wordmark" role="img" aria-label="Heelbent"></span>
  &copy; 2021&ndash;2026 Alejandro Rafael Gener. All rights reserved. &middot;
  Text and figures licensed
  <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>

theme:
  name: material
  language: en
  logo: assets/brand/logo-mark.png
  favicon: assets/brand/logo-mark.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  # Version selector: populated by `mike` (see README.md and .github/workflows/publish.yml)
  version:
    provider: mike
    default: latest
    alias: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.tilde       # ~~strikethrough~~ (Chapter 1 title)
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3
